# Development profile using in-memory H2 database for local dev/run
spring.datasource.url=jdbc:h2:mem:aura;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (use env var in real dev)
jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong
jwt.expiration-ms=28800000
